name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build para Windows
    runs-on: windows-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt || pip install PyQt6 PyMuPDF

    - name: Compilar con PyInstaller
      run: |
        pyinstaller --name "HR_DigiTool" --windowed --onefile --icon="LOGO.png" --add-data "LOGO.png;." main.py

    - name: Subir el ejecutable a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: HR_DigiTool-Windows
        path: dist/*