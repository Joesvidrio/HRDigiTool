name: Build Windows Installer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Directory with PyInstaller
        # Genera la carpeta dist/HRDigiTool con el .exe y sus DLLs
        run: pyinstaller main.spec

      - name: Compile Installer with Inno Setup
        # Toma la carpeta dist/HRDigiTool y crea dist_installer/HRDigiTool_Setup.exe
        run: iscc installer.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v3
        with:
          name: HRDigiTool-Windows-Installer
          path: dist_installer/HRDigiTool_Setup.exe